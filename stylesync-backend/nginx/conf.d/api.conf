upstream stylesync_api {
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "DENY"           always;
    add_header X-XSS-Protection          "1; mode=block"  always;
    add_header Referrer-Policy           "no-referrer"    always;
    add_header Content-Security-Policy   "default-src 'none'; frame-ancestors 'none';" always;

    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$ ) {
        return 405;
    }

    if ($http_user_agent ~* (sqlmap|nikto|nmap|masscan|zgrab|scanner)) {
        return 403;
    }

    location = /health {
        proxy_pass         http://stylesync_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log         off;
    }

    location = /api/outfits/generate {
        limit_req  zone=outfits burst=3 nodelay;
        include    /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://stylesync_api;
    }

    location /api/ {
        limit_req  zone=global burst=30 nodelay;
        include    /etc/nginx/conf.d/proxy_params.conf;
        proxy_pass http://stylesync_api;
    }

    location / {
        return 404;
    }
}
